<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電子音楽 × 女性ボーカル 1曲ずつ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f1fb;--card:#fff;--ink:#1b1740;--sub:#6a6590;--line:#d9d4f0;--a:#e0267f;--b:#0a8fb0;--chip:#ebe7fa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d26;--card:#1a1740;--ink:#f1eeff;--sub:#a49fd0;--line:#332f66;--a:#ff5fae;--b:#5ee6ff;--chip:#272359}}
:root[data-theme="dark"]{--bg:#0f0d26;--card:#1a1740;--ink:#f1eeff;--sub:#a49fd0;--line:#332f66;--a:#ff5fae;--b:#5ee6ff;--chip:#272359}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:15px;font-weight:700;color:var(--sub);margin:0 0 14px}
.song{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;position:relative;overflow:hidden}
.song:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--a),var(--b))}
.title{font-size:28px;font-weight:900;line-height:1.3;margin:6px 0 2px;word-break:break-word}
.artist{font-size:16px;color:var(--sub);margin:0 0 6px}
.note{font-size:13px;color:var(--sub);margin:0 0 14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tag{background:var(--chip);border-radius:999px;padding:2px 11px;font-size:13px}
h2{font-size:14px;margin:20px 0 8px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--ink);text-decoration:none;font-size:14px;background:var(--card)}
.links a.main{background:var(--b);border-color:var(--b);color:#04202a;font-weight:700}
.hint{font-size:12px;color:var(--sub);margin:8px 0 0}
.next{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 6px;font-weight:700;font-size:14px}
.next button{background:var(--a);border-color:var(--a);color:#fff}
.next button:nth-child(2){background:#7c4dff;border-color:#7c4dff}
.next button:nth-child(3){background:var(--chip);color:var(--ink);border-color:var(--line)}
button:focus-visible,a:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.vote{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px}
.vote h2{margin-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{padding:6px 13px;font-weight:400;border-radius:999px}
.opts button[aria-pressed="true"]{background:var(--b);border-color:var(--b);color:#04202a;font-weight:700}
.msg{min-height:20px;font-size:13px;color:var(--sub);margin:10px 0 0}
.links a.sp{background:#1DB954;border-color:#1DB954;color:#04140a;font-weight:700}
.links a.am{background:#FA243C;border-color:#FA243C;color:#fff;font-weight:700}
.links a.yt{background:#FF0000;border-color:#FF0000;color:#fff;font-weight:700}
</style>
</head>
<body>
<main>
<h1>電子音楽 × 女性ボーカル(キャラソン・アイドル・同人)を1曲ずつ</h1>
<section class="song" aria-live="polite">
  <div class="note" id="count"></div>
  <div class="title" id="title"></div>
  <p class="artist" id="artist"></p>
  <div class="tags" id="tags"></div>
  <h2>聴く</h2>
  <div class="links" id="links"></div>
  <p class="hint" id="hint"></p>
  <div class="next">
    <button id="nArtist">同じアーティスト</button>
    <button id="nGenre">同じジャンル</button>
    <button id="nRandom">ランダム</button>
  </div>
  <p class="msg" id="msg"></p>
</section>
<section class="vote">
  <h2>この曲のジャンルを登録(任意・複数選択可)</h2>
  <div class="opts" id="opts"></div>
  <p class="hint">投票は匿名で、ログインは不要です。同じ曲・同じジャンルへの投票は1人1回までで、押し直すと取り消せます。票数はみんなの合計です。</p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://fxwtwijpspqijjhosthl.supabase.co";
const SUPABASE_KEY="sb_publishable_Wc37mqiPYARjc3YwcTwhRw_UreAlhCO"; // 公開用キー(埋め込んで問題ないもの)
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const GENRES=["Classic House","Tech House","Progressive/Melodic House","Big Room","Tropical House","Bounce House/Slap House","Deep House","Electro House","Pop House","Classic Trance","Progressive Trance","Trance House (Trouse)","Psytrance","Tribal Circuit","Melodic Circuit","Disco House/Nu-Disco","Dubstep/Brostep","Melodic Dubstep","Sadboi","EDM Remix","Breakbeats/Drum and Bass","Future House","Trap","Hardstyle"];
const $=id=>document.getElementById(id);
let SONGS=[],counts={},mine={},cur=null,busy=false;

function setCounts(rows){counts={};(rows||[]).forEach(r=>{(counts[r.song_id]=counts[r.song_id]||{})[r.genre]=r.n})}
const topGenres=s=>Object.entries(counts[s.id]||{}).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
const q=s=>encodeURIComponent((s.artist+" "+s.title).trim());
const pick=list=>{const o=list.filter(x=>x!==cur);return o.length?o[Math.floor(Math.random()*o.length)]:null};

function show(s,msg){
  cur=s;
  $("count").textContent="全"+SONGS.length+"曲のうちの1曲";
  $("title").textContent=s.title;
  $("artist").textContent=s.artist;
  const T=$("tags");T.innerHTML="";
  const tg=topGenres(s);
  if(!tg.length){const e=document.createElement("span");e.className="tag";e.textContent="ジャンル未登録";T.appendChild(e)}
  tg.forEach(([g,n])=>{const e=document.createElement("span");e.className="tag";e.textContent=g+" ("+n+")";T.appendChild(e)});
  const L=$("links");L.innerHTML="";
  const add=(label,href,cls)=>{const e=document.createElement("a");e.textContent=label;e.href=href;e.target="_blank";e.rel="noopener";if(cls)e.className=cls;L.appendChild(e)};
  if(s.spotify_url){add("Spotifyで聴く",s.spotify_url,"sp");$("hint").textContent=""}
  else if(s.apple_music_url){add("Apple Musicで聴く",s.apple_music_url,"am");$("hint").textContent=""}
  else if(s.video_url){add("動画で聴く",s.video_url,/youtube\.com|youtu\.be/.test(s.video_url)?"yt":"");$("hint").textContent="サブスク配信が見つからないため動画を表示しています。"}
  else{
    add("Spotifyで探す","https://open.spotify.com/search/"+q(s),"sp");
    add("Apple Musicで探す","https://music.apple.com/jp/search?term="+q(s),"am");
    add("YouTubeで探す","https://www.youtube.com/results?search_query="+q(s),"yt");
    $("hint").textContent="確認済みのリンクがまだ無いため、検索リンクを表示しています。";
  }
  $("msg").textContent=msg||"";
  renderVote();
}
function renderVote(){
  const my=mine[cur.id]||new Set();
  const O=$("opts");O.innerHTML="";
  GENRES.forEach(g=>{
    const b=document.createElement("button");b.textContent=g;
    b.setAttribute("aria-pressed",my.has(g));
    b.onclick=()=>toggle(g);
    O.appendChild(b);
  });
}
async function toggle(g){
  if(busy)return;busy=true;
  const id=cur.id;
  try{
    const {data:{session}}=await db.auth.getSession();
    if(!session){const r=await db.auth.signInAnonymously();if(r.error)throw r.error}
    if(mine[id]&&mine[id].has(g)){
      const r=await db.from("votes").delete().match({song_id:id,genre:g});if(r.error)throw r.error;
      mine[id].delete(g);
    }else{
      const r=await db.from("votes").insert({song_id:id,genre:g});if(r.error)throw r.error;
      (mine[id]=mine[id]||new Set()).add(g);
    }
    const c=await db.from("genre_counts").select("*");if(c.error)throw c.error;
    setCounts(c.data);
    show(cur,"保存しました。");
  }catch(e){$("msg").textContent="保存できませんでした: "+(e.message||e)}
  busy=false;
}
$("nRandom").onclick=()=>cur&&show(pick(SONGS));
$("nArtist").onclick=()=>{
  if(!cur)return;
  const s=pick(SONGS.filter(x=>x.artist_group===cur.artist_group));
  s?show(s):show(pick(SONGS),"このアーティストの他の曲は未登録のため、ランダムで選びました。");
};
$("nGenre").onclick=()=>{
  if(!cur)return;
  const mineG=topGenres(cur).map(e=>e[0]);
  const s=pick(SONGS.filter(x=>topGenres(x).some(e=>mineG.includes(e[0]))));
  s?show(s):show(pick(SONGS),mineG.length?"同じジャンルの曲がまだ無いため、ランダムで選びました。":"この曲はジャンル未登録のため、ランダムで選びました。");
};
async function init(){
  $("title").textContent="読み込み中…";
  try{
    const [s,c]=await Promise.all([db.from("songs").select("*"),db.from("genre_counts").select("*")]);
    if(s.error)throw s.error;if(c.error)throw c.error;
    SONGS=s.data;setCounts(c.data);
    const {data:{session}}=await db.auth.getSession();
    if(session){
      const v=await db.from("votes").select("song_id,genre");
      if(!v.error)(v.data||[]).forEach(r=>{(mine[r.song_id]=mine[r.song_id]||new Set()).add(r.genre)});
    }
    if(!SONGS.length){$("title").textContent="曲がまだありません";return}
    show(SONGS[Math.floor(Math.random()*SONGS.length)]);
  }catch(e){
    $("title").textContent="読み込めませんでした";
    $("msg").textContent="エラー: "+(e.message||e);
  }
}
init();
</script>
</body>
</html>
