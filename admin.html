<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>候補の承認(管理用)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f1fb;--card:#fff;--ink:#1b1740;--sub:#6a6590;--line:#d9d4f0;--a:#e0267f;--b:#0a8fb0;--chip:#ebe7fa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d26;--card:#1a1740;--ink:#f1eeff;--sub:#a49fd0;--line:#332f66;--a:#ff5fae;--b:#5ee6ff;--chip:#272359}}
:root[data-theme="dark"]{--bg:#0f0d26;--card:#1a1740;--ink:#f1eeff;--sub:#a49fd0;--line:#332f66;--a:#ff5fae;--b:#5ee6ff;--chip:#272359}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:15px;font-weight:700;color:var(--sub);margin:0 0 14px}
.song{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;position:relative;overflow:hidden}
.song:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--a),var(--b))}
.title{font-size:28px;font-weight:900;line-height:1.3;margin:6px 0 2px;word-break:break-word}
.artist{font-size:16px;color:var(--sub);margin:0 0 6px}
.note{font-size:13px;color:var(--sub);margin:0 0 14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tag{background:var(--chip);border-radius:999px;padding:2px 11px;font-size:13px}
h2{font-size:14px;margin:20px 0 8px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--ink);text-decoration:none;font-size:14px;background:var(--card)}
.links a.main{background:var(--b);border-color:var(--b);color:#04202a;font-weight:700}
.hint{font-size:12px;color:var(--sub);margin:8px 0 0}
.next{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 6px;font-weight:700;font-size:14px}
.next button{background:var(--a);border-color:var(--a);color:#fff}
.next button:nth-child(2){background:#7c4dff;border-color:#7c4dff}
.next button:nth-child(3){background:var(--chip);color:var(--ink);border-color:var(--line)}
button:focus-visible,a:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.vote{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px}
.vote h2{margin-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{padding:6px 13px;font-weight:400;border-radius:999px}
.opts button[aria-pressed="true"]{background:var(--b);border-color:var(--b);color:#04202a;font-weight:700}
.msg{min-height:20px;font-size:13px;color:var(--sub);margin:10px 0 0}
.card input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin:2px 0 8px}
.lbl{font-size:12px;color:var(--sub)}
.act{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.act .ok{background:var(--b);border-color:var(--b);color:#04202a}
.act .ng{background:var(--a);border-color:var(--a);color:#fff}
.sub{display:flex;gap:8px;margin-top:10px}
.sub button{flex:1;font-weight:400;padding:8px}
.login input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin:4px 0 10px}
</style>
</head>
<body>
<main>
<h1>候補の承認(管理用)</h1>
<section class="song login" id="login">
  <div class="lbl">管理者のメールアドレス</div>
  <input id="em" type="email" autocomplete="username">
  <div class="lbl">パスワード</div>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="go" style="width:100%">ログイン</button>
  <p class="msg" id="lmsg"></p>
</section>
<section class="song card" id="work" hidden>
  <div class="note" id="count"></div>
  <div class="lbl">曲名</div><input id="t">
  <div class="lbl">アーティスト</div><input id="a">
  <div class="lbl">グループ名(「同じアーティスト」でまとめる名前)</div><input id="g">
  <p class="note" id="src"></p>
  <h2>聴いて確かめる</h2>
  <div class="links" id="links"></div>
  <div class="act">
    <button class="ok" id="okb">採用</button>
    <button class="ng" id="ngb">却下</button>
    <button id="skb">スキップ</button>
  </div>
  <div class="sub"><button id="undo">直前の操作を取り消す</button><button id="out">ログアウト</button></div>
  <p class="msg" id="msg"></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient("https://fxwtwijpspqijjhosthl.supabase.co","sb_publishable_Wc37mqiPYARjc3YwcTwhRw_UreAlhCO");
const $=id=>document.getElementById(id);
let list=[],last=null,busy=false;

async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(!session||!session.user.email){$("login").hidden=false;$("work").hidden=true;return}
  const ad=await db.from("admins").select("user_id");
  if(ad.error||!ad.data||!ad.data.length){
    $("login").hidden=false;$("work").hidden=true;
    $("lmsg").textContent="このアカウントは管理者ではありません。";return;
  }
  const r=await db.from("songs").select("*").eq("status","pending").order("id").limit(500);
  if(r.error){$("lmsg").textContent="読み込みエラー: "+r.error.message;return}
  list=r.data;
  $("login").hidden=true;$("work").hidden=false;
  show();
}
function q(){return encodeURIComponent(($("a").value+" "+$("t").value).trim())}
function show(msg){
  $("msg").textContent=msg||"";
  const has=list.length>0;
  ["t","a","g","okb","ngb","skb"].forEach(i=>$(i).disabled=!has);
  if(!has){
    $("count").textContent="承認待ちの候補はありません。";
    ["t","a","g"].forEach(i=>$(i).value="");$("src").textContent="";$("links").innerHTML="";return;
  }
  const s=list[0];
  $("count").textContent="承認待ち 残り"+list.length+"件";
  $("t").value=s.title;$("a").value=s.artist;$("g").value=s.artist_group;
  $("src").textContent=s.source?"出どころ: "+s.source:"";
  const L=$("links");L.innerHTML="";
  [["Spotifyで探す","https://open.spotify.com/search/"],["Apple Musicで探す","https://music.apple.com/jp/search?term="],["YouTubeで探す","https://www.youtube.com/results?search_query="]].forEach(([n,u],i)=>{
    const e=document.createElement("a");e.textContent=n;e.target="_blank";e.rel="noopener";if(i==0)e.className="main";
    e.onclick=()=>{e.href=u+q()};e.href=u+q();L.appendChild(e);
  });
}
["t","a"].forEach(i=>$(i).oninput=()=>{const s=document.querySelectorAll("#links a");const u=["https://open.spotify.com/search/","https://music.apple.com/jp/search?term=","https://www.youtube.com/results?search_query="];s.forEach((e,k)=>e.href=u[k]+q())});

async function decide(status){
  if(busy||!list.length)return;busy=true;
  const s=list[0];
  const upd={status,title:$("t").value.trim(),artist:$("a").value.trim(),artist_group:$("g").value.trim()||$("a").value.trim()};
  const r=await db.from("songs").update(upd).eq("id",s.id).select();
  if(r.error||!r.data.length){busy=false;show("保存できませんでした: "+(r.error?r.error.message:"権限がありません"));return}
  last={prev:s};list.shift();busy=false;
  show(status==="published"?"採用しました。":"却下しました。");
}
$("okb").onclick=()=>decide("published");
$("ngb").onclick=()=>decide("rejected");
$("skb").onclick=()=>{if(list.length>1){list.push(list.shift())}show("スキップしました。")};
$("undo").onclick=async()=>{
  if(!last||busy)return;busy=true;
  const p=last.prev;
  const r=await db.from("songs").update({status:"pending",title:p.title,artist:p.artist,artist_group:p.artist_group}).eq("id",p.id).select();
  busy=false;
  if(r.error){show("取り消せませんでした: "+r.error.message);return}
  list.unshift(p);last=null;show("取り消しました。");
};
$("go").onclick=async()=>{
  $("lmsg").textContent="ログイン中…";
  const r=await db.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(r.error){$("lmsg").textContent="ログインできませんでした: "+r.error.message;return}
  $("lmsg").textContent="";start();
};
$("out").onclick=async()=>{await db.auth.signOut();list=[];start()};
start();
</script>
</body>
</html>
